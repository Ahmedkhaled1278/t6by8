name: Extract Nour Social Platform ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP safely
        run: |
          set -e
          ZIP="nour_social_platform_0.26.6_ci_validation.zip"
          test -f "$ZIP"
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted
          git commit -m "Extract Nour Social Platform ZIP" || exit 0
          git push
