name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Deployed HTTPS URL for the Nour web app'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate deployment URL
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          node -e 'const u = new URL(process.env.APP_URL); if (u.protocol !== "https:") { console.error("app_url must use HTTPS"); process.exit(1); }'

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nour/api prisma:generate

      - name: Build and sync Capacitor Android project
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.app_url }}
        run: pnpm mobile:sync

      - name: Build debug APK
        run: pnpm mobile:apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nour-social-platform-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
